<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TopCoders: practise coding problems in C++, Java, Python and JavaScript, earn stars, join monthly hackathons and climb the leaderboard." />
  <meta name="theme-color" content="#f5f6f9" />
  <meta property="og:title" content="TopCoders" />
  <meta property="og:description" content="Practise coding problems, earn stars and join monthly hackathons." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>TopCoders</title>
  <script>
    // Saved theme (light by default) applied before first paint, so there's no flash.
    try {
      var t = localStorage.getItem("topcoders-theme");
      document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
